
name: Build AstroStack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Download LibRaw Android source
        run: |
          git clone --depth 1 https://github.com/TSGames/Libraw-Android.git /tmp/Libraw-Android

      - name: Fix LibRaw source paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/Libraw-Android/jni/libraw/Android.mk")
          s = p.read_text()

          start = s.index("FILE_LIST :=")
          end = s.index("#FILE_LIST:= libraw.cpp", start)

          replacement = """FILE_LIST := swab.c \\
          libraw.c \\
          ../src/internal/dcraw_common.cpp \\
          ../src/internal/dcraw_fileio.cpp \\
          ../src/internal/demosaic_packs.cpp \\
          ../src/src/libraw_datastream.cpp \\
          ../src/src/libraw_cxx.cpp \\
          ../src/src/libraw_c_api.cpp
          """

          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print("LibRaw source paths fixed")
          PY

      - name: Build LibRaw
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.13846066"
          cd /tmp/Libraw-Android

          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=libs \
            NDK_OUT=obj

      - name: Copy LibRaw libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          cp /tmp/Libraw-Android/libs/arm64-v8a/liblibraw.so \
             app/src/main/jniLibs/arm64-v8a/

          cp /tmp/Libraw-Android/libs/armeabi-v7a/liblibraw.so \
             app/src/main/jniLibs/armeabi-v7a/

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-APK
          path: app/build/outputs/apk/debug/*.apk
